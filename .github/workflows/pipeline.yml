name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

jobs:
  validate:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run database migration
        run: |
          flyway \
            -group=true \
            -url=jdbc:postgresql://localhost:5432/${{ secrets.DB_NAME }} \
            -user=${{ secrets.DB_USER }} \
            -password=${{ secrets.DB_PASSWORD }} \
            -locations=filesystem:./migrations \
            migrate

      - name: Build Docker image
        run: docker build -t merge-to-prod-pipeline .

      - name: Stop old container
        run: |
          docker rm -f merge-to-prod-pipeline || true

      - name: Start new container
        run: |
          docker run -d \
            --name merge-to-prod-pipeline \
            --add-host=host.docker.internal:host-gateway \
            -p 3000:3000 \
            --env-file .env.docker \
            merge-to-prod-pipeline

      - name: Health check
        run: |
          sleep 5
          curl --fail http://localhost:3000/api/v1/health